<!DOCTYPE html>
<html>
<head>
    <title>error:404 - Not Found</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #000000; color: #ff0000; padding: 40px 20px; text-align: center; }
        a { color: #ff0000; text-decoration: none; font-weight: bold; border: 1px solid #ff0000; padding: 5px 15px; border-radius: 3px; display: inline-block; margin-top: 25px; }
        a:hover { background: #ff0000; color: #000000; }
        .err-title { font-size: 2.2em; font-weight: bold; letter-spacing: 2px; margin-bottom: 30px; }
        .reason-box { max-width: 500px; margin: 0 auto; text-align: left; background: #111111; border: 1px solid #ff0000; padding: 20px; border-radius: 5px; font-size: 0.95em; line-height: 1.6; }
        .reason-title { font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #ff0000; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="err-title">error:404</div>
    
    <div class="reason-box">
        <div class="reason-title">なぜ表示されたか</div>
        <div>1, サーバー管理人のデータベースの接続が切れてる可能性があります。</div>
        <div>2, 作成主が削除した可能性があります。</div>
    </div>
    
    <div><a href="/">ホームに戻る</a></div>
</body>
</html>
