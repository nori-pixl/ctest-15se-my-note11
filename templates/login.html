<!DOCTYPE html>
<html>
<head>
    <title>ログイン</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        /* 🌟 menu.html / board.html のレトロなスタイルシートと完全に一致させています */
        body { font-family: sans-serif; background: #fffff0; color: #000000; padding: 20px; line-height: 1.4; }
        a { color: #0000ff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .menu-title { font-size: 1.4em; font-weight: bold; color: #ff0000; text-align: center; margin-bottom: 15px; border-bottom: 2px solid #ff0000; padding-bottom: 10px; }
        .section-title { font-size: 1.1em; font-weight: bold; color: #ff0000; margin-top: 25px; margin-bottom: 10px; border-left: 4px solid #ff0000; padding-left: 8px; }
        .form-table { background: #fafafa; border: 1px solid #ccc; padding: 15px; width: 100%; max-width: 450px; margin: 0 auto; border-radius: 4px; }
        input[type="text"], input[type="password"] { background: #ffffff; color: #000000; border: 1px solid #ccc; padding: 6px; width: 180px; }
        input:focus { border-color: #ff0000; outline: none; }
        button { background: #fafafa; color: #000000; border: 1px solid #ccc; padding: 4px 12px; cursor: pointer; font-weight: bold; }
        button:hover { background: #eee; }
        .error-msg { color: #ff0000; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .link-box { text-align: center; margin-top: 20px; font-size: 0.95em; }
    </style>
</head>
<body>
    <div class="menu-title">掲示板システム・ログインポータル</div>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for message in messages %}<div class="error-msg">[注意] {{ message }}</div>{% endfor %}{% endif %}
    {% endwith %}

    <div class="section-title" style="text-align: center; max-width: 450px; margin-left: auto; margin-right: auto;">ログイン情報を入力してください</div>
    
    <form method="POST" action="/login">
        <table class="form-table" border="0">
            <tr>
                <td style="width: 100px;">なまえ:</td>
                <td><input type="text" name="username" placeholder="ユーザー名" required autocomplete="off"></td>
            </tr>
            <tr>
                <td>パスワード:</td>
                <td><input type="password" name="password" placeholder="パスワード" required></td>
            </tr>
            <tr>
                <td></td>
                <td style="padding-top: 10px;"><button type="submit">ログインする</button></td>
            </tr>
        </table>
    </form>
    
    <div class="link-box">
        <a href="/register">新しくアカウントを作る場合はこちら >></a>
    </div>
</body>
</html>
